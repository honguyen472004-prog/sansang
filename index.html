<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sẵn sàng</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background: radial-gradient(circle at center, #2E6DFF 0%, #123B8A 40%, #061739 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        .background-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(46, 109, 255, 0.2) 0%, transparent 60%);
            animation: pulseBg 3s infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes pulseBg {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .hud-container {
            width: 650px;
            height: 650px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        
        .ring-1 {
            width: 650px;
            height: 650px;
            animation: rotate 30s linear infinite;
        }

        .ring-2 {
            width: 500px;
            height: 500px;
            animation: rotateReverse 20s linear infinite;
        }

        .ring-3 {
            width: 380px;
            height: 380px;
            animation: rotate 15s linear infinite;
        }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes rotateReverse {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(-360deg); }
        }

        .btn-wrapper {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
        }

        .ready-text {
            color: #00E5FF;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00E5FF, 0 0 20px #00E5FF;
            animation: pulseText 1.5s infinite alternate;
        }

        @keyframes pulseText {
            0% { opacity: 0.6; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        .start-button {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle at top, #FF2A2A, #D50000);
            border: 18px solid white;
            box-shadow: 0 0 40px rgba(255,0,0,0.6), 0 0 80px rgba(255,0,0,0.3);
            
            font-size: 36px;
            font-weight: 700;
            color: white;
            letter-spacing: 2px;
            text-transform: uppercase;
            
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .start-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px red, 0 0 60px red;
        }

        .start-button:active {
            transform: scale(0.95);
            box-shadow: 0 0 20px red, 0 0 40px red;
        }

        .icon-layer {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 5;
        }

        .tech-icon {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid rgba(0,255,255,0.4);
            color: #2FE8FF;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            background: rgba(0, 229, 255, 0.05);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
            
            /* Độ mờ 20% */
            opacity: 0.2;
            
            /* Bay từ dưới lên */
            animation: moveUpRandom linear infinite;
        }

        @keyframes moveUpRandom {
            0% { top: 110%; opacity: 0; transform: translateX(0) scale(0.8); }
            10% { opacity: 0.2; } 
            90% { opacity: 0.2; }
            100% { top: -10%; opacity: 0; transform: translateX(30px) scale(1); }
        }

        .popup-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(6, 23, 57, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .popup-box {
            background-color: #ffffff;
            width: 700px;
            padding: 50px 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .popup-backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        .popup-backdrop.active .popup-box {
            transform: scale(1);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background-color: #20C997;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px auto;
            box-shadow: 0 10px 20px rgba(32, 201, 151, 0.3);
        }

        .success-icon svg {
            width: 40px;
            height: 40px;
        }

        .popup-title {
            color: #1A202C;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 24px;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .popup-desc {
            color: #4A5568;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.6;
            text-transform: uppercase;
        }

        .popup-btn {
            background-color: #3B82F6;
            color: white;
            border: none;
            padding: 14px 48px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 24px;
            transition: background-color 0.2s, transform 0.2s;
        }

        .popup-btn:hover {
            background-color: #2563EB;
            transform: translateY(-2px);
        }

        .popup-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Nền phát sáng -->
    <div class="background-glow"></div>

    <!-- Các Icon bay ngẫu nhiên -->
    <div class="icon-layer">
        <div class="tech-icon" style="left: 10%; animation-duration: 8s; animation-delay: 0s;"><i class="fas fa-folder"></i></div>
        <div class="tech-icon" style="left: 85%; animation-duration: 10s; animation-delay: 2s;"><i class="fas fa-share-nodes"></i></div>
        <div class="tech-icon" style="left: 20%; animation-duration: 7s; animation-delay: 4s;"><i class="fas fa-computer"></i></div>
        <div class="tech-icon" style="left: 75%; animation-duration: 9s; animation-delay: 1s;"><i class="fas fa-battery-half"></i></div>
        <div class="tech-icon" style="left: 15%; animation-duration: 11s; animation-delay: 5s;"><i class="fas fa-mobile-screen"></i></div>
        <div class="tech-icon" style="left: 80%; animation-duration: 8.5s; animation-delay: 3s;"><i class="fas fa-wifi"></i></div>
        <div class="tech-icon" style="left: 30%; animation-duration: 9.5s; animation-delay: 2.5s;"><i class="fas fa-cloud"></i></div>
        <div class="tech-icon" style="left: 65%; animation-duration: 7.5s; animation-delay: 0.5s;"><i class="fab fa-windows"></i></div>
        <div class="tech-icon" style="left: 5%; animation-duration: 12s; animation-delay: 6s;"><i class="fas fa-network-wired"></i></div>
        <div class="tech-icon" style="left: 90%; animation-duration: 10.5s; animation-delay: 1.5s;"><i class="fas fa-microchip"></i></div>
    </div>

    <!-- Cụm trung tâm -->
    <div class="hud-container">
        
        <!-- Vòng 1 -->
        <svg class="ring ring-1" viewBox="0 0 650 650">
            <circle cx="325" cy="325" r="300" fill="none" stroke="rgba(0, 229, 255, 0.4)" stroke-width="2" stroke-dasharray="20 10 40 10" />
            <circle cx="325" cy="325" r="315" fill="none" stroke="rgba(47, 232, 255, 0.6)" stroke-width="8" stroke-dasharray="100 150 200 50" />
        </svg>

        <!-- Vòng 2 -->
        <svg class="ring ring-2" viewBox="0 0 500 500">
            <circle cx="250" cy="250" r="230" fill="none" stroke="rgba(0, 229, 255, 0.5)" stroke-width="12" stroke-dasharray="80 120 60 100" />
            <circle cx="250" cy="250" r="210" fill="none" stroke="rgba(47, 232, 255, 0.3)" stroke-width="1" stroke-dasharray="5 5" />
        </svg>

        <!-- Vòng 3 -->
        <svg class="ring ring-3" viewBox="0 0 380 380">
            <circle cx="190" cy="190" r="170" fill="none" stroke="rgba(0, 229, 255, 0.7)" stroke-width="4" stroke-dasharray="40 40" />
        </svg>

        <!-- Nút Bấm -->
        <div class="btn-wrapper">
            <div class="ready-text">XÁC NHẬN ĐĂNG KÝ</div>
            <button class="start-button" id="startBtn">
                ĐĂNG KÝ
            </button>
        </div>
    </div>

    <!-- Popup Xác nhận -->
    <div class="popup-backdrop" id="popupBackdrop">
        <div class="popup-box">
            <!-- Icon Success -->
            <div class="success-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5 13L9 17L19 7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            
            <h2 class="popup-title">ĐĂNG KÝ<br>THÀNH CÔNG</h2>

            <button class="popup-btn" id="closeModalBtn">Đóng</button>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const popupBackdrop = document.getElementById('popupBackdrop');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // Mở popup
        startBtn.addEventListener('click', () => {
            popupBackdrop.classList.add('active');
        });

        // Đóng popup
        closeModalBtn.addEventListener('click', () => {
            popupBackdrop.classList.remove('active');
        });

        popupBackdrop.addEventListener('click', (e) => {
            if (e.target === popupBackdrop) {
                popupBackdrop.classList.remove('active');
            }
        });
    </script>
</body>
</html>
