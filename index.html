<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao Diện Nút START Chuyển Đổi Số</title>
    <!-- Tải FontAwesome cho các icon công nghệ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-blue: #2FE8FF;
            --button-red-1: #FF2A2A;
            --button-red-2: #D50000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            /* Nền theo đúng mô tả */
            background: radial-gradient(circle at center, #2E6DFF 0%, #123B8A 40%, #061739 100%);
        }

        /* Nền phát sáng nhẹ ở tâm */
        .background-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(46, 109, 255, 0.2) 0%, transparent 60%);
            animation: pulseBg 4s infinite alternate;
            z-index: 1;
        }

        @keyframes pulseBg {
            0% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotateReverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        /* Hiệu ứng bay ngẫu nhiên từ dưới lên cho các icon với opacity tối đa 20% */
        @keyframes moveUpRandom {
            0% { 
                top: 110%; 
                opacity: 0;
            }
            10% {
                opacity: 0.2; /* Tối đa 20% opacity */
            }
            90% {
                opacity: 0.2; /* Duy trì 20% opacity */
            }
            100% { 
                top: -10%; 
                opacity: 0;
            }
        }

        .hud-container {
            width: 650px;
            height: 650px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* SVG HUD Rings */
        .hud-rings {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Không nhận sự kiện click */
        }

        .ring-1 {
            transform-origin: center;
            animation: rotate 30s linear infinite;
        }

        .ring-2 {
            transform-origin: center;
            animation: rotateReverse 20s linear infinite;
        }

        .ring-3 {
            transform-origin: center;
            animation: rotate 40s linear infinite;
        }

        /* Nút START */
        .start-button {
            position: relative;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 18px solid white;
            background: radial-gradient(circle at top, var(--button-red-1), var(--button-red-2));
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.6), 0 0 80px rgba(255, 0, 0, 0.3);
            
            /* Text styles */
            font-size: 48px; /* Đã giảm 25% từ 64px xuống 48px */
            font-weight: 700;
            color: white;
            letter-spacing: 3px;
            font-family: Arial, sans-serif;
            cursor: pointer;
            
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            
            /* Hiệu ứng chuyển đổi mượt mà */
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease;
        }

        .start-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px red, 0 0 60px red, inset 0 0 20px rgba(255,255,255,0.3);
        }

        .start-button:active {
            transform: scale(0.95);
            box-shadow: 0 0 15px red, 0 0 30px red;
            transition: transform 0.1s ease;
        }

        .tech-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 5;
            pointer-events: none;
        }

        /* Đường kết nối dùng SVG */
        .connection-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .connection-lines line {
            stroke: url(#line-gradient);
            stroke-width: 1.5;
            opacity: 0.3;
        }

        .tech-icon {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 255, 0.4);
            background: rgba(6, 23, 57, 0.6);
            backdrop-filter: blur(4px);
            
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary-blue);
            font-size: 24px;
            
            /* Đặt tọa độ từ tâm để căn giữa chuẩn xác theo trục X */
            transform: translateX(-50%);
            opacity: 0; 
            animation: moveUpRandom linear infinite;
        }

        /* Khung Popup */
        .popup-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(6, 23, 57, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            
            /* Trạng thái ẩn ban đầu */
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .popup-box {
            background-color: #ffffff;
            width: 400px;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            
            /* Hiệu ứng scale */
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Khi hiển thị popup */
        .popup-backdrop.show {
            opacity: 1;
            visibility: visible;
        }

        .popup-backdrop.show .popup-box {
            transform: scale(1);
        }

        .popup-icon {
            width: 70px;
            height: 70px;
            background-color: #10B981; /* Màu xanh lá chuẩn */
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            margin: 0 auto 20px auto;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .popup-title {
            color: #1F2937;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .popup-desc {
            color: #6B7280;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .popup-btn {
            background-color: #3B82F6;
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .popup-btn:hover {
            background-color: #2563EB;
        }

        .popup-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Lớp nền phát sáng -->
    <div class="background-glow"></div>

    <div class="tech-layer">
        <!-- SVG vẽ các đường line mảnh kết nối ra icon -->
        <svg class="connection-lines">
            <defs>
                <linearGradient id="line-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="transparent" />
                    <stop offset="50%" stop-color="#00E5FF" />
                    <stop offset="100%" stop-color="transparent" />
                </linearGradient>
            </defs>
            <!-- Các đường line (Tọa độ x2, y2 tương ứng với vị trí các icon) -->
            <line x1="50%" y1="50%" x2="15%" y2="15%" />
            <line x1="50%" y1="50%" x2="85%" y2="15%" />
            <line x1="50%" y1="50%" x2="10%" y2="40%" />
            <line x1="50%" y1="50%" x2="90%" y2="35%" />
            <line x1="50%" y1="50%" x2="12%" y2="65%" />
            <line x1="50%" y1="50%" x2="88%" y2="70%" />
            <line x1="50%" y1="50%" x2="25%" y2="85%" />
            <line x1="50%" y1="50%" x2="75%" y2="85%" />
            <line x1="50%" y1="50%" x2="50%" y2="10%" />
            <line x1="50%" y1="50%" x2="50%" y2="90%" />
        </svg>

        <!-- Các icon công nghệ bố trí ngẫu nhiên bay từ dưới lên -->
        <div class="tech-icon" style="left: 15%; animation-duration: 12s; animation-delay: 0s;"><i class="fa-regular fa-folder"></i></div>
        <div class="tech-icon" style="left: 85%; animation-duration: 15s; animation-delay: 2s;"><i class="fa-solid fa-share-nodes"></i></div>
        <div class="tech-icon" style="left: 10%; animation-duration: 10s; animation-delay: 4s;"><i class="fa-solid fa-desktop"></i></div>
        <div class="tech-icon" style="left: 90%; animation-duration: 18s; animation-delay: 1s;"><i class="fa-solid fa-battery-three-quarters"></i></div>
        <div class="tech-icon" style="left: 12%; animation-duration: 14s; animation-delay: 5s;"><i class="fa-solid fa-mobile-screen-button"></i></div>
        <div class="tech-icon" style="left: 88%; animation-duration: 11s; animation-delay: 3s;"><i class="fa-solid fa-wifi"></i></div>
        <div class="tech-icon" style="left: 25%; animation-duration: 16s; animation-delay: 7s;"><i class="fa-solid fa-network-wired"></i></div>
        <div class="tech-icon" style="left: 75%; animation-duration: 13s; animation-delay: 6s;"><i class="fa-brands fa-windows"></i></div>
        <div class="tech-icon" style="left: 45%; animation-duration: 17s; animation-delay: 2.5s;"><i class="fa-solid fa-cloud-arrow-up"></i></div>
        <div class="tech-icon" style="left: 55%; animation-duration: 19s; animation-delay: 0.5s;"><i class="fa-solid fa-microchip"></i></div>
    </div>

    <div class="hud-container">
        <!-- Vòng tròn công nghệ (HUD) bằng SVG -->
        <svg class="hud-rings" viewBox="0 0 650 650">
            <!-- Layer 1: Vòng đứt nét ngoài cùng xoay xuôi -->
            <g class="ring-1">
                <circle cx="325" cy="325" r="280" fill="none" stroke="#2FE8FF" stroke-width="2" stroke-dasharray="10 30" opacity="0.6"/>
                <circle cx="325" cy="325" r="260" fill="none" stroke="#2FE8FF" stroke-width="8" stroke-dasharray="50 150 200 50" opacity="0.4"/>
                <path d="M 325 45 A 280 280 0 0 1 560 170" fill="none" stroke="#2FE8FF" stroke-width="12" opacity="0.7"/>
                <path d="M 325 605 A 280 280 0 0 1 90 480" fill="none" stroke="#2FE8FF" stroke-width="12" opacity="0.7"/>
            </g>

            <!-- Layer 2: Các vòng nhỏ, hình học xoay ngược -->
            <g class="ring-2">
                <circle cx="325" cy="325" r="220" fill="none" stroke="#2FE8FF" stroke-width="1" opacity="0.5"/>
                <rect x="320" y="95" width="10" height="20" fill="#2FE8FF" opacity="0.8"/>
                <rect x="320" y="535" width="10" height="20" fill="#2FE8FF" opacity="0.8"/>
                <rect x="95" y="320" width="20" height="10" fill="#2FE8FF" opacity="0.8"/>
                <rect x="535" y="320" width="20" height="10" fill="#2FE8FF" opacity="0.8"/>
                <circle cx="325" cy="325" r="200" fill="none" stroke="#2FE8FF" stroke-width="4" stroke-dasharray="1 15" opacity="0.8"/>
            </g>

            <!-- Layer 3: Vòng sát nút bấm xoay xuôi -->
            <g class="ring-3">
                <circle cx="325" cy="325" r="160" fill="none" stroke="#2FE8FF" stroke-width="16" stroke-dasharray="80 40" opacity="0.3"/>
                <circle cx="325" cy="325" r="175" fill="none" stroke="#2FE8FF" stroke-width="2" stroke-dasharray="5 5" opacity="0.8"/>
            </g>
        </svg>

        <!-- Nút bấm START chính -->
        <button class="start-button" id="startBtn">
            START
        </button>

    </div>

    <div class="popup-backdrop" id="successModal">
        <div class="popup-box">
            <div class="popup-icon">
                <i class="fa-solid fa-check"></i>
            </div>
            <h2 class="popup-title">XÁC NHẬN THÀNH CÔNG</h2>
            <p class="popup-desc">QUYẾT TÂM HOÀN THÀNH THẮNG LỢI ĐỢT THI ĐUA "150 NGÀY ĐÊM"</p>
            <p class="popup-desc">HOÀN THÀNH 100% CHỈ TIÊU KHÁM SỨC KHỎE TOÀN DÂN NĂM 2026</p>
            <button class="popup-btn" id="closeModalBtn">Đóng</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const startBtn = document.getElementById('startBtn');
            const modal = document.getElementById('successModal');
            const closeBtn = document.getElementById('closeModalBtn');

            // Mở popup
            startBtn.addEventListener('click', () => {
                modal.classList.add('show');
            });

            // Đóng popup khi nhấn nút Đóng
            closeBtn.addEventListener('click', () => {
                modal.classList.remove('show');
            });

            // Đóng popup khi nhấn ra ngoài khu vực hộp trắng (vào nền mờ)
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('show');
                }
            });

            // Tiện ích: Đóng popup khi bấm phím ESC trên bàn phím
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal.classList.contains('show')) {
                    modal.classList.remove('show');
                }
            });
        });
    </script>
</body>
</html>
